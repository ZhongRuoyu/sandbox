name: Docker build

on:
  workflow_call:
    inputs:
      dockerhub-username:
        type: string
      ghcr-username:
        type: string
      username:
        type: string
      primary-tag:
        type: string
      tags:
        type: string
      template:
        type: string
      base-image:
        type: string
      arches:
        type: string
      push:
        type: boolean
    secrets:
      DOCKERHUB_TOKEN:
        required: true

permissions: {}

defaults:
  run:
    shell: bash -euxo pipefail {0}

jobs:
  sandbox:
    name: Build sandbox image
    uses: ./.github/workflows/docker-build-multiarch.yml
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      contents: read
      packages: write # for pushing image
    with:
      dockerhub-username: ${{ inputs.dockerhub-username }}
      ghcr-username: ${{ inputs.ghcr-username }}
      repository: sandbox
      primary-tag: ${{ inputs.primary-tag }}
      tags: ${{ inputs.tags }}
      file: sandbox/${{ inputs.template }}.Dockerfile
      build-args: |
        BASE_IMAGE=${{ inputs.base-image }}
      arches: ${{ inputs.arches }}
      push: ${{ inputs.push }}

  workbench:
    name: Build workbench image
    needs: sandbox
    uses: ./.github/workflows/docker-build-multiarch.yml
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      contents: read
      packages: write # for pushing image
    with:
      dockerhub-username: ${{ inputs.dockerhub-username }}
      ghcr-username: ${{ inputs.ghcr-username }}
      repository: workbench
      primary-tag: ${{ inputs.primary-tag }}
      tags: ${{ inputs.tags }}
      file: workbench/${{ inputs.template }}.Dockerfile
      build-args: |
        BASE_IMAGE=ghcr.io/${{ inputs.ghcr-username }}/sandbox:${{ inputs.primary-tag }}
        USERNAME=${{ inputs.username }}
      arches: ${{ inputs.arches }}
      push: ${{ inputs.push }}
