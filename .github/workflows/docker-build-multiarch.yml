name: Docker multi-arch build

on:
  workflow_call:
    inputs:
      dockerhub-username:
        type: string
      ghcr-username:
        type: string
      repository:
        type: string
      primary-tag:
        type: string
      tags:
        type: string
      file:
        type: string
      build-args:
        type: string
      arches:
        type: string
      push:
        type: boolean
    secrets:
      DOCKERHUB_TOKEN:
        required: true

permissions: {}

defaults:
  run:
    shell: bash -euxo pipefail {0}

env:
  DOCKERHUB_REPOSITORY: ${{ inputs.dockerhub-username }}/${{ inputs.repository }}
  GHCR_REPOSITORY: ghcr.io/${{ inputs.ghcr-username }}/${{ inputs.repository }}

jobs:
  setup:
    name: Set up build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.metadata.outputs.tags }}
      labels: ${{ steps.metadata.outputs.labels }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Determine Docker image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.DOCKERHUB_REPOSITORY }}
            ${{ env.GHCR_REPOSITORY }}
          flavor: |
            latest=false
          tags: ${{ inputs.tags }}
      - name: Set up build matrix
        id: matrix
        run: |
          matrix_json='{"arch": []}'
          for ARCH in $ARCHES; do
            matrix_json="$(
              echo "$matrix_json" |
                jq --compact-output --arg arch "$ARCH" '.arch += [$arch]'
            )"
          done
          echo "matrix=$matrix_json" >>"$GITHUB_OUTPUT"
        env:
          ARCHES: ${{ inputs.arches }}

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    environment:
      name: docker
      deployment: false
    permissions:
      contents: read
      packages: write # for pushing image
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Login to Docker Hub
        if: inputs.push
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          username: ${{ inputs.dockerhub-username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        if: inputs.push
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ inputs.ghcr-username }}
          password: ${{ github.token }}
      - name: Set up build
        id: setup
        run: |
          {
            if [[ "$PUSH" = true ]]; then
              echo "outputs<<OUTPUTS"
              echo "type=image,name=$DOCKERHUB_REPOSITORY,name-canonical=true,push=true,push-by-digest=true"
              echo "type=image,name=$GHCR_REPOSITORY,name-canonical=true,push=true,push-by-digest=true"
              echo "OUTPUTS"
            else
              echo "outputs="
            fi
          } >> "$GITHUB_OUTPUT"
        env:
          PUSH: ${{ inputs.push }}
      - name: Build and push Docker image by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          file: ${{ inputs.file }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ needs.setup.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          outputs: ${{ steps.setup.outputs.outputs }}
      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP"/digests
          echo "${DIGEST#sha256:}" >"$RUNNER_TEMP"/digests/"$REPOSITORY-$PRIMARY_TAG-$ARCH"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REPOSITORY: ${{ inputs.repository }}
          PRIMARY_TAG: ${{ inputs.primary-tag }}
          ARCH: ${{ matrix.arch }}
      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ inputs.repository }}-${{ inputs.primary-tag }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*

  merge:
    name: Merge
    if: inputs.push
    needs: [setup, build]
    runs-on: ubuntu-latest
    environment:
      name: docker
      deployment: false
    permissions:
      contents: read
      packages: write # for pushing image
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Login to Docker Hub
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          username: ${{ inputs.dockerhub-username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ inputs.ghcr-username }}
          password: ${{ github.token }}
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.repository }}-${{ inputs.primary-tag }}-*
          merge-multiple: true
      - name: Create manifest list and push
        run: |
          mapfile -t tags <<< "$TAGS"
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag="$tag")
          done
          images=()
          for ARCH in $ARCHES; do
            images+=("ghcr.io/$GHCR_USERNAME/$REPOSITORY@sha256:$(cat "$RUNNER_TEMP"/digests/"$REPOSITORY-$PRIMARY_TAG-$ARCH")")
          done
          docker buildx imagetools create "${tag_args[@]}" "${images[@]}"
        env:
          DOCKERHUB_USERNAME: ${{ inputs.dockerhub-username }}
          GHCR_USERNAME: ${{ inputs.ghcr-username }}
          REPOSITORY: ${{ inputs.repository }}
          PRIMARY_TAG: ${{ inputs.primary-tag }}
          ARCHES: ${{ inputs.arches }}
          TAGS: ${{ needs.setup.outputs.tags }}
